server:
  port: 8080

spring:
  application:
    name: reconciliation-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reconciliation}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          reconiq:
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
            provider: reconiq
            client-name: ReconIQ
        provider:
          reconiq:
            issuer-uri: ${OIDC_ISSUER_URI}
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
