spring.application.name=reconciliation-service

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:reconciliation-service}
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.properties.specific.avro.reader=false

reconciliation.kafka.topic=${CANONICAL_TOPIC:txn.canonical}