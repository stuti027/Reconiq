name: normalization-service

on:
  push:
    branches: [phase_2]
    paths:
      - "backend/normalization-service/**"
      - ".github/workflows/normalization-service.yml"
  pull_request:
    paths:
      - "backend/normalization-service/**"
      - ".github/workflows/normalization-service.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify
        run: mvn -B -f backend/normalization-service/pom.xml verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/normalization-service/target/surefire-reports/
